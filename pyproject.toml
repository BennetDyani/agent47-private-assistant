[project]
name = "malume"
version = "0.1.0"
description = "Malume - a South African multilingual voice assistant (prototype)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-dotenv>=1.0",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
azure = ["azure-cognitiveservices-speech>=1.40"]
mms = ["torch>=2.3", "transformers>=4.45", "soundfile>=0.12", "numpy>=1.26"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
